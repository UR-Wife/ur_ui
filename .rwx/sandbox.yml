on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: elixir:1.20.5-otp-29
  config: rwx/base 1.2.2

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      repository: https://github.com/UR-Wife/ur_ui.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github.token }}
      preserve-git-dir: true
      fetch-full-depth: true

  - key: gpgv
    filter: []
    run: |
      sudo apt-get update
      sudo apt-get install -y gpgv
      sudo apt-get clean

  - key: node
    use: [gpgv]
    call: nodejs/install 1.2.1
    with:
      node-version: "22.23.5"

  - key: sandbox
    use: [code, node]
    run: |
      mix local.hex --force && mix local.rebar --force
      mix deps.get
      MIX_ENV=test mix deps.get
      (cd e2e && npm ci)
      rwx-sandbox
